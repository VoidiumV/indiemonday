<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indie Monday</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<iframe 
  src="https://script.google.com/macros/s/AKfycbxYjeV_EKZzQiLUu4fRYPmnSeQcb7NIaqX72jyjHkrsENm-IR8gkLeRVyl0RHS2cVSY/exec" 
  allow="clipboard-write" 
  style="width:100%; height:100vh; border:none;">
</iframe>

  <script>
    const REAL_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYjeV_EKZzQiLUu4fRYPmnSeQcb7NIaqX72jyjHkrsENm-IR8gkLeRVyl0RHS2cVSY/exec";

    const iframe = document.getElementById("site-frame");

    // Pass any link hash (e.g., #article-slug) straight into the Google Apps Script app
    iframe.src = REAL_APPS_SCRIPT_URL + window.location.hash;

    // Listen for hash changes on indiemonday.pages.dev and sync with iframe
    window.addEventListener("hashchange", () => {
      iframe.src = REAL_APPS_SCRIPT_URL + window.location.hash;
    });
  </script>

</body>
</html>
