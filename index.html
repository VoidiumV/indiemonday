<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indie Monday</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<iframe 
  id="site-frame"
  src="https://script.google.com/macros/s/AKfycbwQRPjOfyzM0xHTCBs7ouMBZQ1FydJHrIeO8OGeyBdjzFYXWSgJTvcuktRjMI9qyFP2/exec" 
  allow="clipboard-write" 
  style="width:100%; height:100vh; border:none;">
</iframe>

  <script>
    const REAL_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQRPjOfyzM0xHTCBs7ouMBZQ1FydJHrIeO8OGeyBdjzFYXWSgJTvcuktRjMI9qyFP2/exec";
    const iframe = document.getElementById("site-frame");

    // Load initial hash into the iframe URL on initial page load
    iframe.src = REAL_APPS_SCRIPT_URL + window.location.hash;

    // Listen for hash changes on the main domain (e.g. user manually changes URL/hash) and forward to iframe
    window.addEventListener("hashchange", () => {
      iframe.contentWindow.postMessage({
        type: "HASH_CHANGE",
        hash: window.location.hash
      }, "*");
    });

    // Listen for hash update messages sent from inside the Apps Script iframe
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "URL_HASH_UPDATE") {
        if (window.location.hash !== event.data.hash) {
          history.replaceState(null, "", event.data.hash);
        }
      }
    });
  </script>

</body>
</html>
