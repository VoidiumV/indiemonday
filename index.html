<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indie Monday</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbwXD2CxbOwXbkhc180KLuG0UanS0Mr1iAXxaoa7HARNb25GOULJPDeTkYGnlSNRNXW1/exec"></iframe>

  <script>
    var iframe = document.getElementById('app-iframe');

    // 1. Send current parent location hash to iframe once iframe finishes loading
    iframe.addEventListener('load', function() {
      if (window.location.hash) {
        iframe.contentWindow.postMessage({ type: 'HASH_CHANGE', hash: window.location.hash }, '*');
      }
    });

    // 2. Listen for URL hash changes from child iframe and update parent address bar
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'URL_HASH_UPDATE') {
        if (window.location.hash !== event.data.hash) {
          history.replaceState(null, '', event.data.hash || '#');
        }
      }
    });

    // 3. Listen for parent hash changes (browser back/forward or manual edits) and send to iframe
    window.addEventListener('hashchange', function() {
      iframe.contentWindow.postMessage({ type: 'HASH_CHANGE', hash: window.location.hash }, '*');
    });
  </script>
</body>
</html>
