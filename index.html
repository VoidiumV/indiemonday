<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indie Monday</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="site-frame" src="" allowfullscreen></iframe>

  <script>
    const REAL_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJzB5rxPt9k8UNUmyr7c3saKT-Nr3w7POKvl8YPQ_KLVGfc2VEk2Wgq9skonPltfIQ/exec";

    const iframe = document.getElementById("site-frame");

    // Pass any link hash (e.g., #article-slug) straight into the Google Apps Script app
    iframe.src = REAL_APPS_SCRIPT_URL + window.location.hash;

    // Listen for hash changes on indiemonday.pages.dev and sync with iframe
    window.addEventListener("hashchange", () => {
      iframe.src = REAL_APPS_SCRIPT_URL + window.location.hash;
    });
  </script>

</body>
</html>
